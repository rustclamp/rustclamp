[package]
name = "rustclamp-example-email-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[dependencies]
rustclamp-core = { version = "0.1.0", path = "../../../core" }
rustclamp-kernel = { version = "0.1.0", path = "../../../kernel" }
rustclamp-messaging = { version = "0.1.0", path = "../../../messaging" }
rustclamp-worker = { version = "0.1.0", path = "../../../worker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[[example]]
name = "08-email-worker"
path = "examples/run.rs"

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
