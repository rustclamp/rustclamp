[package]
name = "rustclamp-example-create-order"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[dependencies]
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream"] }
rustclamp-messaging = { version = "0.1.0", path = "../../../messaging" }
rustclamp-postgres = { version = "0.1.0", path = "../../../postgres" }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[[bin]]
name = "orders-api"
path = "src/bin/api.rs"

[[bin]]
name = "outbox-publisher"
path = "src/bin/publisher.rs"

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
