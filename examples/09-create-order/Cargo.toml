[package]
name = "rustclamp-example-create-order"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[dependencies]
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream"] }
futures-util = "0.3"
rustclamp-core = { version = "0.1.0", path = "../../../core" }
rustclamp-kernel = { version = "0.1.0", path = "../../../kernel" }
rustclamp-messaging = { version = "0.1.0", path = "../../../messaging" }
rustclamp-postgres = { version = "0.1.0", path = "../../../postgres" }
rustclamp-scheduler = { version = "0.1.0", path = "../../../scheduler" }
rustclamp-tooling = { version = "0.1.0", path = "../../tooling", optional = true }
rustclamp-worker = { version = "0.1.0", path = "../../../worker" }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[features]
tooling-inspection = ["dep:rustclamp-tooling"]

[[bin]]
name = "orders-api"
path = "src/bin/api.rs"

[[bin]]
name = "outbox-publisher"
path = "src/bin/publisher.rs"

[[bin]]
name = "orders-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "phase7-inspect"
path = "src/bin/inspect.rs"

[[bin]]
name = "measure-jetstream"
path = "src/bin/measure_jetstream.rs"

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
