[package]
name = "rustclamp-example-observability"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[workspace]
resolver = "3"

[dependencies]
rustclamp-core = { version = "0.1.0", path = "../../../core" }
rustclamp-http = { version = "0.1.0", path = "../../../http" }
rustclamp-kernel = { version = "0.1.0", path = "../../../kernel" }
rustclamp-messaging = { version = "0.1.0", path = "../../../messaging" }
rustclamp-worker = { version = "0.1.0", path = "../../../worker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[[example]]
name = "09-observability"
path = "main.rs"
test = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
