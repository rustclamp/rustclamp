[package]
name = "rustclamp-macros"
version = "1.0.0"
edition = "2024"
rust-version = "1.96.1"
description = "Derive macros for rustclamp, such as #[derive(Model)]. Use them through rustclamp."
repository = "https://github.com/rustclamp/rustclamp"
license = "MIT OR Apache-2.0"
homepage = "https://rustclamp.com"
documentation = "https://docs.rs/rustclamp-macros"
readme = "../README.md"
keywords = ["framework", "derive", "model"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = "3"
