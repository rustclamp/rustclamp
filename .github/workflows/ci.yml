name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # tooling depends on ../../core and ../../kernel: check the repos out side by side.
      - uses: actions/checkout@v7
        with:
          path: rustclamp
      - uses: actions/checkout@v7
        with:
          repository: rustclamp/core
          path: core
      - uses: actions/checkout@v7
        with:
          repository: rustclamp/kernel
          path: kernel
      # rust-toolchain.toml pins 1.96.1 with clippy and rustfmt; rustup installs it on first use.
      # ponytail: facade and tooling only; the examples need the full coordinated checkout (tools/check.py)
      - name: Facade
        working-directory: rustclamp
        run: |
          cargo fmt --check
          # boundaries.py reads offline metadata for every target, wasm-only crates included
          cargo fetch
          cargo clippy --all-features --all-targets -- -D warnings
          cargo test --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
      - name: Tooling
        working-directory: rustclamp/tooling
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # Every web starter kit must install and build: plain, Vue and React.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Web kits
        working-directory: rustclamp/tooling
        run: |
          cargo build --locked --bin clamp
          for kit in web vue react; do
            ./target/debug/clamp init "$RUNNER_TEMP/kit-$kit" --$kit
            (cd "$RUNNER_TEMP/kit-$kit" && npm install --no-audit --no-fund && npm run build)
          done
      # The Rust side of each scaffold must resolve as a git dependency, with no
      # sibling repos in reach (#86). Patch only rustclamp itself to this commit.
      - name: Scaffolds resolve
        working-directory: rustclamp/tooling
        run: |
          for kit in web package; do
            ./target/debug/clamp init "$RUNNER_TEMP/rs-$kit" --$kit
            printf '\n[patch."https://github.com/rustclamp/rustclamp"]\nrustclamp = { path = "%s" }\n' "$GITHUB_WORKSPACE/rustclamp" >> "$RUNNER_TEMP/rs-$kit/Cargo.toml"
            (cd "$RUNNER_TEMP/rs-$kit" && cargo check)
          done
