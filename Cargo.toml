[package]
name = "rustclamp"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "A minimal synchronous entrypoint for Clamp applications."
repository = "https://github.com/rustclamp/rustclamp"
readme = "README.md"
publish = false
autoexamples = false

[features]
# Optional std-only HTTP server for `clamp init --web` apps.
web = ["config", "log"]
# Optional `.env` and environment configuration (`rustclamp::config`).
config = []
# Optional leveled logging to `storage/logs/app.log` (`rustclamp::log`).
log = ["config"]
# Optional build-script helpers (`rustclamp::build`), such as migration discovery.
build = []
# Optional SQLite database from `.env` (`rustclamp::db`); compiles SQLite in.
db = ["config", "dep:rusqlite"]

[[example]]
name = "00-pico"
path = "examples/00-pico/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
