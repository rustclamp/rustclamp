[package]
name = "rustclamp-tooling"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false
description = "Developer inspection commands for resolved Clamp process models."

[workspace]
resolver = "3"

[dependencies]
rustclamp-core = { version = "0.1.0", path = "../../core" }
rustclamp-kernel = { version = "0.1.0", path = "../../kernel" }
serde_json = "1"

[[bin]]
name = "clamp"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
