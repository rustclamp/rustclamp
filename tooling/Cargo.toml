[package]
name = "rustclamp-tooling"
version = "0.5.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
publish = false
description = "Developer inspection commands for resolved Clamp process models."

[workspace]
resolver = "3"

[dependencies]
rustclamp-core = { version = "0.1.0", path = "../../core" }
rustclamp-kernel = { version = "0.1.0", path = "../../kernel" }
serde_json = "1"
rustclamp = { version = "0.1.0", path = "..", features = ["crypto"] }

[[bin]]
name = "clamp"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

# rustclamp's core dependency is a git dependency (#86); in the side-by-side checkout use the sibling.
[patch."https://github.com/rustclamp/core"]
rustclamp-core = { path = "../../core" }
